kind = "mobile"
previewPath = "/"
title = "ForgetMeNot AI"
description = "A multimodal personal intelligence assistant that predicts what people are likely to forget before it becomes a problem. Includes an AI home, events, capture, chat, profile, predictions, actions, memory space, and contact screens with a distinctive F-in-globe identity."
version = "1.0.0"
id = "artifacts/forgetmenot-ai"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 20655

[services.development]
run = "pnpm --filter @workspace/forgetmenot-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/forgetmenot-ai", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/forgetmenot-ai", "run", "serve" ]

[services.env]
PORT = "20655"
BASE_PATH = "/"
